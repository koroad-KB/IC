<script>
let currentInfoWindow = null;  
let signalData = [];
let markers = [];
let overlays = [];
let clusterer = null;
  let selectedGroup = null;
  

let clickMarker = null;
let clickLat = "";
let clickLng = "";
let coordMode = false;

coordMode = false;

document.getElementById("copyBtn").style.display="block";

// 구글 스프레드시트에서 장비 데이터를 불러옵니다.
function renderDevices(data) {
    // 기존 지도 객체를 정리해 중복 표시를 방지합니다.
    if (clusterer) clusterer.clear();
    markers.forEach(marker => marker.setMap(null));
    overlays.forEach(overlay => overlay.setMap(null));
    markers = [];
    overlays = [];

    data.forEach(function(item) {
        const lat = Number(item.lat);
        const lng = Number(item.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
            lat < 33 || lat > 39 || lng < 124 || lng > 132) {
            console.warn("좌표가 올바르지 않아 제외한 장비:", item);
            return;
        }

        const position = new kakao.maps.LatLng(lat, lng);

        // 지도 위에 표시할 장비명
        const nameDiv = document.createElement("div");
        nameDiv.style.cssText = "background:white;border:1px solid #777;border-radius:5px;padding:4px 8px;font-size:13px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;";
        // 코드/신호군/장비명 색상 적용
        const codeSpan = document.createElement("span");
        codeSpan.textContent = item.code || "";
        codeSpan.style.color = item.codeColor || "#000000";
        const groupSpan = document.createElement("span");
        groupSpan.textContent = ` (${item.group || ""})`;
        groupSpan.style.color = item.groupColor || "#555555";
        const nameSpan = document.createElement("span");
        nameSpan.textContent = `-${item.name || ""}`;
        nameSpan.style.color = item.nameColor || "#000000";
        nameDiv.append(codeSpan, groupSpan, nameSpan);

        const overlay = new kakao.maps.CustomOverlay({
            position: position,
            xAnchor: 0.5,
            yAnchor: 0.5,
            clickable: true,
            content: nameDiv
        });
        overlay.setMap(map);
        overlays.push(overlay);

        const escapeHtml = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
        const infoContent = document.createElement("div");
        infoContent.style.cssText = "padding:12px;font-size:14px;line-height:1.7;min-width:220px;";
        const infoTitle = document.createElement("div");
        infoTitle.style.cssText = "font-size:17px;font-weight:bold;margin-bottom:8px;border-bottom:1px solid #ddd;padding-bottom:6px;";
        infoTitle.textContent = `${item.code || ""}(${item.group || ""})-${item.name || ""}`;
        infoContent.appendChild(infoTitle);
        const infoDetails = document.createElement("div");
        const rows = [
            ["장비종류", item.deviceType ?? item.region],
            ["단속속도", item.speed ?? item.local],
            ["검지방식", item.detectionMethod ?? item.police],
            ["보호구역", item.protectedArea],
            ["최초운영일", item.operationDate ?? item.smart]
        ];
        infoDetails.innerHTML = rows.map(([label, value]) => `<b>${label}</b> : ${escapeHtml(value || "-")}`).join("<br>");
        infoContent.appendChild(infoDetails);

        const actionRow = document.createElement("div");
        actionRow.style.cssText = "display:flex;gap:6px;margin-top:12px;";
        const routeButton = document.createElement("button");
        routeButton.type = "button";
        routeButton.textContent = "🧭 길찾기";
        routeButton.style.cssText = "flex:1;padding:7px;background:#FEE500;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;";
        routeButton.addEventListener("click", () => routeTo(lat, lng, String(item.name || "장비")));
        const roadButton = document.createElement("button");
        roadButton.type = "button";
        roadButton.textContent = "📷 로드뷰";
        roadButton.style.cssText = "flex:1;padding:7px;background:#4CAF50;color:white;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;";
        roadButton.addEventListener("click", () => roadView(lat, lng));
        actionRow.append(routeButton, roadButton);
        infoContent.appendChild(actionRow);

        const infowindow = new kakao.maps.InfoWindow({ content: infoContent });
        const openInfo = function(event) {
            if (event && typeof event.stopPropagation === "function") event.stopPropagation();
            if (currentInfoWindow) currentInfoWindow.close();
            infowindow.setPosition(position);
            infowindow.open(map);
            currentInfoWindow = infowindow;
        };
        nameDiv.addEventListener("click", openInfo);

        // 실제 좌표에 투명 마커를 두어 클러스터링과 클릭을 지원합니다.
        const transparentImage = new kakao.maps.MarkerImage(
            "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=",
            new kakao.maps.Size(1, 1)
        );
        const marker = new kakao.maps.Marker({
            position: position,
            image: transparentImage,
            clickable: true
        });
        kakao.maps.event.addListener(marker, "click", openInfo);
        markers.push(marker);
    });

    if (!clusterer) {
        clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 7
        });
    }
    clusterer.clear();
    clusterer.addMarkers(markers);
    updateOverlayVisible();
    kakao.maps.event.removeListener(map, "zoom_changed", updateOverlayVisible);
    kakao.maps.event.addListener(map, "zoom_changed", updateOverlayVisible);
}

fetch("https://script.google.com/macros/s/AKfycbzht6ww3-miWPtjrrZhPF4omrzQ9nig_EdKjQqlVZ0uDGbX0SxJ5DleCQy2MHM0tVZnDw/exec")
    .then(response => {
        if (!response.ok) throw new Error("HTTP 오류: " + response.status);
        return response.json();
    })
    .then(data => {
        if (!Array.isArray(data)) {
            throw new Error(data?.error || "장비 데이터 형식이 올바르지 않습니다.");
        }
        // 이후 검색·표시 함수에서 사용하는 데이터 목록
        signalData = data.filter(item => {
            const lat = Number(item.lat), lng = Number(item.lng);
            return Number.isFinite(lat) && Number.isFinite(lng) &&
                   lat >= 33 && lat <= 39 && lng >= 124 && lng <= 132;
        });
        renderDevices(signalData);
        console.info(`장비 데이터 ${signalData.length}건을 불러왔습니다.`);
    })
    .catch(error => {
        console.error("장비 데이터 불러오기 실패:", error);
        const errorBox = document.createElement("div");
        errorBox.style.cssText = "position:absolute;top:65px;left:10px;right:10px;z-index:2000;background:#fff3f3;color:#9b1c1c;padding:12px;border:1px solid #e0a0a0;border-radius:8px;font-size:14px;";
        errorBox.textContent = "장비 정보를 불러오지 못했습니다. 구글 스프레드시트 웹 앱 배포 상태와 데이터 연결을 확인해 주세요.";
        document.body.appendChild(errorBox);
    });

let myLocationMarker = null;


// ========================================
// 신호기 이름 표시 여부
// 7단계 이상 → 이름 숨김
// 6단계 이하 → 이름 표시
// ========================================

function updateOverlayVisible(){

    const level = map.getLevel();

    overlays.forEach(function(overlay, index){

        // =====================================
        // 신호군 검색 상태
        // =====================================
        if(selectedGroup !== null){

            const item = signalData[index];

            if(
                item &&
                String(item.group || "").trim().toUpperCase()
                === selectedGroup
            ){

                // 검색된 신호군만 표시
                if(level >= 7){
                    overlay.setMap(null);
                }else{
                    overlay.setMap(map);
                }

            }else{

                // 다른 신호군은 계속 숨김
                overlay.setMap(null);

            }

            return;
        }


        // =====================================
        // 일반 상태
        // =====================================
        if(level >= 7){

            overlay.setMap(null);

        }else{

            overlay.setMap(map);

        }

    });

}
  
document.getElementById("gpsBtn").onclick = function(){

    if(!navigator.geolocation){

        alert("현재 위치를 사용할 수 없습니다.");
        return;

    }

    const gpsBtn = this;

    // 누르는 즉시 버튼 표시 변경
    gpsBtn.style.background = "#E3F2FD";
    gpsBtn.innerHTML = "⏳";

    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const loc = new kakao.maps.LatLng(lat, lng);

            // 기존 위치 마커 제거
            if(myLocationMarker){
                myLocationMarker.setMap(null);
            }

            // 현재 위치 표시
            myLocationMarker = new kakao.maps.Marker({
                map: map,
                position: loc
            });

            // 지도 이동
            map.setCenter(loc);
            map.setLevel(3);

            // 버튼 원래대로
            gpsBtn.style.background = "white";
            gpsBtn.innerHTML = `
                <svg viewBox="0 0 64 64" width="38" height="38">
                    <circle cx="32" cy="32" r="18"
                            fill="none"
                            stroke="#1976D2"
                            stroke-width="3"/>

                    <line x1="32" y1="10" x2="32" y2="21"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="32" y1="43" x2="32" y2="54"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="10" y1="32" x2="21" y2="32"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="43" y1="32" x2="54" y2="32"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <circle cx="32" cy="32" r="4"
                            fill="#1976D2"/>
                </svg>
            `;

        },

        function(error){

            gpsBtn.style.background = "white";
            gpsBtn.innerHTML = "📍";

            if(error.code === 1){
                alert("위치 정보 사용이 차단되어 있습니다.");
            }
            else if(error.code === 2){
                alert("현재 위치를 확인할 수 없습니다.");
            }
            else if(error.code === 3){
                alert("현재 위치 확인 시간이 초과되었습니다.");
            }
            else{
                alert("현재 위치를 확인할 수 없습니다.");
            }

        },

        {
            enableHighAccuracy: false,
            timeout: 30000,
            maximumAge: 60000
        }

    );

};
document.getElementById("searchBtn").onclick = function(){

    const searchBox = document.getElementById("searchBox");
    const keyword = searchBox.value.trim();

    if(keyword === ""){
        searchBox.blur();
        return;
    }


    // =========================================
    // ① 신호군 검색
    // 예 : 996G
    // =========================================

    const groupResults = signalData.filter(function(item){

        return String(item.group || "")
            .trim()
            .toUpperCase() === keyword.toUpperCase();

    });


    if(groupResults.length > 0){

        selectedGroup = keyword.toUpperCase();

        if(clusterer){
            clusterer.clear();
        }

        // 모든 마커 숨기기
        markers.forEach(function(marker){
            marker.setMap(null);
        });

        // 모든 이름 숨기기
        overlays.forEach(function(overlay){
            overlay.setMap(null);
        });


        // 검색된 신호군만 표시
        const groupMarkers = [];

        groupResults.forEach(function(item){

            const index = signalData.indexOf(item);

            if(index !== -1){

                if(markers[index]){
                    markers[index].setMap(map);
                    groupMarkers.push(markers[index]);
                }

                if(overlays[index]){
                    overlays[index].setMap(map);
                }

            }

        });


        // 검색된 신호군만 클러스터링
        if(clusterer){
            clusterer.addMarkers(groupMarkers);
        }


        // 신호군 전체가 보이도록
        const bounds = new kakao.maps.LatLngBounds();

        groupResults.forEach(function(item){

            bounds.extend(
                new kakao.maps.LatLng(
                    Number(item.lat),
                    Number(item.lng)
                )
            );

        });

        map.setBounds(bounds);


        // 너무 넓게 잡히면 확대
        setTimeout(function(){

            if(map.getLevel() > 6){
                map.setLevel(6);
            }

            groupResults.forEach(function(item){

                const index = signalData.indexOf(item);

                if(overlays[index]){
                    overlays[index].setMap(map);
                }

            });

        }, 100);


        searchBox.value = "";
        searchBox.blur();

        return;
    }



    // =========================================
    // ② 일반 신호기 검색
    // 예 : 4005
    // =========================================

    const item = signalData.find(function(x){

        return (

            String(x.code || "")
                .trim()
                .includes(keyword) ||

            String(x.name || "")
                .trim()
                .includes(keyword)

        );

    });


    if(item){

        // 검색 상태 해제
        selectedGroup = null;

        if(clusterer){
            clusterer.clear();
        }


        // 모든 마커 표시
        markers.forEach(function(marker){
            marker.setMap(map);
        });


        // 전체 클러스터링
        if(clusterer){
            clusterer.addMarkers(markers);
        }


        // 이름 표시
        updateOverlayVisible();


        // 검색된 신호기로 이동
        const position = new kakao.maps.LatLng(
            Number(item.lat),
            Number(item.lng)
        );

        map.setCenter(position);

        // 신호기 검색은 좀 더 확대
        map.setLevel(4);


        searchBox.value = "";
        searchBox.blur();

        return;
    }



    // =========================================
    // ③ 여기부터 주소 / 지번 / 장소 검색
    // =========================================

    // 신호군 / 신호기 검색이 아니므로
    // 전체 상태로 변경
    selectedGroup = null;


    if(clusterer){
        clusterer.clear();
    }


    // 모든 신호기 표시
    markers.forEach(function(marker){
        marker.setMap(map);
    });


    if(clusterer){
        clusterer.addMarkers(markers);
    }


    updateOverlayVisible();



    // =========================================
    // ④ 주소 검색 객체
    // =========================================

    const geocoder = new kakao.maps.services.Geocoder();


    // =========================================
    // ⑤ 먼저 주소 검색
    // 도로명주소 / 지번주소
    // =========================================

    geocoder.addressSearch(
        keyword,

        function(result, status){

            if(status === kakao.maps.services.Status.OK){

                const lat = Number(result[0].y);
                const lng = Number(result[0].x);

                const position =
                    new kakao.maps.LatLng(lat, lng);


                // 지도 이동
                map.setCenter(position);

                // 주소 검색은 조금 확대
                map.setLevel(4);


                // 검색 위치 표시
                showSearchMarker(
                    position,
                    keyword
                );


                searchBox.value = "";
                searchBox.blur();

                return;
            }


            // =====================================
            // ⑥ 주소 검색 실패
            // → 장소 검색으로 넘어감
            // =====================================

            const places =
                new kakao.maps.services.Places();


            places.keywordSearch(
                keyword,

                function(result, status){

                    if(
                        status ===
                        kakao.maps.services.Status.OK
                    ){

                        const place = result[0];

                        const position =
                            new kakao.maps.LatLng(
                                Number(place.y),
                                Number(place.x)
                            );


                        // 지도 이동
                        map.setCenter(position);

                        map.setLevel(4);


                        // 검색 위치 표시
                        showSearchMarker(
                            position,
                            place.place_name
                        );


                        searchBox.value = "";
                        searchBox.blur();

                        return;

                    }


                    // =================================
                    // ⑦ 전부 검색 실패
                    // =================================

                    alert(
                        "검색 결과가 없습니다.\n\n" +

// ========================================
// 거리재기
// ========================================

let distanceMode = false;

let distancePoints = [];

let distanceLine = null;

let distanceMarkers = [];


// 거리 계산 함수
function getDistance(p1, p2){

    const lat1 = p1.getLat();
    const lon1 = p1.getLng();

    const lat2 = p2.getLat();
    const lon2 = p2.getLng();

    const R = 6371000;

    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;
}


// 거리재기 버튼
document.getElementById("distanceBtn").onclick = function(){

    distanceMode = !distanceMode;

    if(distanceMode){

        this.style.background = "#4CAF50";
        this.innerHTML = "❌";

        distancePoints = [];

        document.getElementById("distanceBox").style.display = "block";
        document.getElementById("distanceBox").innerHTML =
            "📏 지도를 클릭하세요";

    }else{

        this.style.background = "white";
        this.innerHTML = "📏";

        clearDistance();

    }

};


// 지도 클릭 시 거리 측정
kakao.maps.event.addListener(map, "click", function(mouseEvent){

    if(!distanceMode){
        return;
    }

    const point = mouseEvent.latLng;

    distancePoints.push(point);


    // 측정 지점 표시
    const marker = new kakao.maps.Marker({
        map: map,
        position: point
    });

    distanceMarkers.push(marker);


    // 두 번째 점부터 선 표시
    if(distancePoints.length >= 2){

        if(distanceLine){
            distanceLine.setMap(null);
        }

        distanceLine = new kakao.maps.Polyline({

            map: map,

            path: distancePoints,

            strokeWeight: 4,

            strokeColor: "#1976D2",

            strokeOpacity: 0.8,

            strokeStyle: "solid"

        });


        // 전체 거리 계산
        let totalDistance = 0;

        for(let i = 1; i < distancePoints.length; i++){

            totalDistance += getDistance(
                distancePoints[i-1],
                distancePoints[i]
            );

        }


        let text;

        if(totalDistance >= 1000){

            text =
                "📏 거리 : " +
                (totalDistance / 1000).toFixed(2) +
                " km";

        }else{

            text =
                "📏 거리 : " +
                Math.round(totalDistance) +
                " m";

        }


        document.getElementById("distanceBox").innerHTML =
            text +
            "<br><span style='font-size:11px;font-weight:normal;'>지점을 계속 클릭하세요</span>";

    }else{

        document.getElementById("distanceBox").innerHTML =
            "📏 첫 번째 지점 선택<br>" +
            "<span style='font-size:11px;font-weight:normal;'>두 번째 지점을 클릭하세요</span>";

    }

});


// 거리 측정 초기화
function clearDistance(){

    distanceMode = false;

    distancePoints = [];


    if(distanceLine){

        distanceLine.setMap(null);

        distanceLine = null;

    }


    distanceMarkers.forEach(function(marker){

        marker.setMap(null);

    });

    distanceMarkers = [];


    document.getElementById("distanceBox").style.display = "none";

}  
</script>
