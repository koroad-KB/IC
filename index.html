<html>
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>인천 장비 지도 테스트</title>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    window.onerror = function(message) {
      alert("오류: " + message);
    };
  </script>

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e734ddc57a7600ac7cfdf25c031a474d&libraries=clusterer,services">
  </script>

  <script>
    const map = new kakao.maps.Map(
      document.getElementById("map"),
      {
        center: new kakao.maps.LatLng(37.4563, 126.7052),
        level: 8
      }
    );
  </script>
</body>
</html>
